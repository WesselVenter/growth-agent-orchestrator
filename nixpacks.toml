# Explicit Nixpacks build config. This is a mixed Python/Node repo — the
# only package.json lives in frontend/, not the repo root, so Railway's
# automatic language detection cannot be trusted to provision Node at all.
# Declaring both toolchains here guarantees `npm` exists during the build.
#
# pip is installed via venv + ensurepip rather than a nix package
# (python312Packages.pip) — that package didn't reliably resolve into the
# active Nix profile for this build's nixpkgs snapshot ("No module named
# pip" despite being declared). ensurepip is part of the Python standard
# library bundled with python312 itself, so it doesn't depend on Nix
# packaging at all. Every phase/command that needs the venv's
# Python/pip must explicitly source the activate script first, since each
# cmd entry runs in its own shell — activation doesn't persist between
# them. railway.toml's [deploy].startCommand (the actual source of truth
# for how the app boots, taking precedence over [start] below) does the
# same activation.

[phases.setup]
nixPkgs = ["python312", "nodejs_20"]

[phases.install]
cmds = [
  "python -m venv /opt/venv",
  ". /opt/venv/bin/activate && python -m ensurepip --upgrade",
  ". /opt/venv/bin/activate && python -m pip install -r requirements.txt",
  "npm --prefix frontend ci",
]

[phases.build]
cmds = ["npm --prefix frontend run build"]

[start]
cmd = ". /opt/venv/bin/activate && python -m alembic upgrade head && python -m uvicorn api.main:app --host 0.0.0.0 --port $PORT"
