# Railway deployment config for the single-service setup: FastAPI serves
# both the API and the built React app (frontend/dist) from one process.
# See nixpacks.toml for the build phase (installs Python + Node deps,
# runs `npm run build` in frontend/) and README.md for the full deploy
# walkthrough and required environment variables.

[build]
builder = "NIXPACKS"

[deploy]
# Activates the venv nixpacks.toml installs dependencies into (packages
# live in /opt/venv, not system site-packages, so a bare `python` here
# would fail with ModuleNotFoundError), then applies any pending Alembic
# migrations, then starts the app. Migrations are safe to run on every
# deploy — `alembic upgrade head` is a no-op once the schema is current.
startCommand = ". /opt/venv/bin/activate && python -m alembic upgrade head && python -m uvicorn api.main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
